<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Scratch Search</title>
  </head>

  <body class="landing-body">
    <div class="landing-shell">
      <div class="landing-card">
        <p class="landing-kicker">Scratch Explorer</p>
        <h1 class="landing-title">Find a Scratcher</h1>

        <form id="scratch-search-form" class="scratch-search-form">
          <input
            id="scratch-search-input"
            type="text"
            name="username"
            placeholder="Search a Scratch username..."
            autocomplete="off"
            aria-label="Search Scratch user"
          />
          <button type="submit">Search</button>
        </form>

        <div class="quick-links">
          <a href="userpage.html?username=yoshihome">yoshihome</a>
          <a href="userpage.html?username=griffpatch">griffpatch</a>
          <a href="userpage.html?username=csquared">csquared</a>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
